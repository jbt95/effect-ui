name: Publish package

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Verify and publish npm package
    runs-on: ubuntu-latest
    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Configure Node.js for package checks and npm publishing
        uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run CI checks
        run: bun run ci

      - name: Verify package release is explicitly enabled
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const tag = process.env.RELEASE_TAG;
            if (pkg.private === true) throw new Error("package.json is private; public publishing is disabled");
            if (pkg.version === "0.0.0") throw new Error("Set an intentional release version before publishing");
            if (tag !== `v${pkg.version}`) throw new Error(`release tag ${tag} must match package version v${pkg.version}`);
            const repository = pkg.repository?.url?.replace(/^git\+/, "").replace(/\.git$/, "");
            if (repository !== `https://github.com/${process.env.GITHUB_REPOSITORY}`) {
              throw new Error("package.json repository.url must match the publishing GitHub repository");
            }
            if (!pkg.bugs?.url) throw new Error("Add the canonical issue tracker URL before publishing");
          '

      - name: Publish with npm provenance
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ "$RELEASE_TAG" == *-* ]]; then
            npm publish --provenance --access public --tag next
          else
            npm publish --provenance --access public --tag latest
          fi
